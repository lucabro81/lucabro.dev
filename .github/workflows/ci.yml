name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm version from package.json engines
        run: npm install -g npm@$(node -p "require('./package.json').engines.npm")

      - name: Install dependencies
        run: npm ci

      - name: Speed up apt downloads
        run: |
          printf 'Acquire::http::Pipeline-Depth "10";\nAcquire::Retries "5";\n' | sudo tee /etc/apt/apt.conf.d/99speed

      - name: Make apt cache dir writable for cache restore
        run: sudo chmod -R a+rwX /var/cache/apt/archives

      - name: Cache apt archives and Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives/*.deb
            ~/.cache/ms-playwright
          key: apt-pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Wait for apt/dpkg lock
        run: |
          while sudo fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/lib/apt/lists/lock >/dev/null 2>&1; do
            echo "apt lock held (unattended-upgrades?), waiting..."
            sleep 5
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests
        run: npm test
        env:
          CI: true

      - name: Build for production
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npm run build

      - name: Deploy to Netlify
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: npx netlify-cli deploy --prod --dir=dist
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
